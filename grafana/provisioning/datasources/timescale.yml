apiVersion: 1

datasources:
  - name: TimescaleDB
    uid: timescale
    type: grafana-postgresql-datasource
    access: proxy
    url: timescaledb:5432
    user: weather
    isDefault: true
    jsonData:
      database: weather
      sslmode: disable
      timescaledb: true
      postgresVersion: 1600
    secureJsonData:
      password: $POSTGRES_PASSWORD
